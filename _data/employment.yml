card-loop:
  - heading: Vice President of Development
    image: /uploads/EFAFCCPics/cfpfcc.jpg
    alt: ''
    overline:
    short-description_html: <p>Angel Foundation™ seeks a strategic,
      relationship-driven, and visionary fundraising leader to serve as its next
      Vice President of Development. Reporting directly to the President &amp;
      CEO and serving as a key member of the Leadership Team, the Vice President
      of Development will lead all fundraising, marketing, communications, and
      donor engagement efforts for the organization.This executive leader will
      oversee the design and execution of a comprehensive development strategy
      that drives sustainable revenue growth, strengthens donor relationships,
      elevates brand visibility, and advances the mission of Angel Foundation™
      statewide. The Vice President of Development will lead and mentor a
      high-performing development and communications team while partnering
      closely with the President and CEO and Board of Directors, community
      leaders, corporate partners, and major donors to expand philanthropic
      support and deepen community engagement.</p>
    location: 1155 Centre Pointe Dr, Ste 7, Mendota Heights, MN, 55120
    commitment: Full Time
    minimum-experience: 10+
    salary-range: $108,000-$115,000
    button-1-text: Learn more
    button-1-link: https://jobs.minnesotanonprofits.org/job/vice-president-of-development-mendota-heights-minnesota-110545
