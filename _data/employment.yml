  - heading: Manager of Outreach & Adult and Family Programs
    image: /uploads/AFPPics/AngelFoundation__Hope5068.jpg
    alt:
    overline:
    short-description_html: '<p>The Manager of Outreach &amp; Adult and Family
      Programming (AFP) is responsible for managing and overseeing the planning
      and implementation of three key areas for Angel Foundation™: 1. Making
      Memories, which provides free experiences for adults impacted by cancer
      and their families and 2. Adult Education, which provides webinars and in
      person education sessions to help adults and their families cope with
      cancer and 3. Outreach into historically marginalized communities to
      ensure awareness and access to all Angel Foundation™ programming.</p>'
    location: 1155 Centre Pointe Dr, Ste 7, Mendota Heights, MN, 55120
    commitment: Full Time
    minimum-experience: ' 3-5 years of related experience'
    salary-range: $55,000-$60,000
